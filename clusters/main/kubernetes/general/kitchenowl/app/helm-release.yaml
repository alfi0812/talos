apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kitchenowl
  namespace: kitchenowl
spec:
  interval: 5m
  chart:
    spec:
      chart: kitchenowl
      version: 14.0.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 5m
  values:
    global:
      stopAll: false
    credentials:
      minio:
        type: s3
        url: "http://${S3_URL}"
        bucket: "${S3_BUCKET}-kitchenowl"
        accessKey: "${S3_ACCESS_KEY}"
        secretKey: "${S3_SECRET_KEY}"
        encrKey: "${S3_ENCRYPTION_KEY}"
    ingress:
      main:
        enabled: true
        ingressClassName: external
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-1-le-prod
        hosts:
          - host: kitchenowl.${DOMAIN_1}
    persistence:
      data:
        volsync:
        - name: data
          type: restic
          credentials: minio
          dest:
            enabled: true
          src:
            enabled: true
            trigger:
              schedule: 20 0 * * *
    cnpg:
      main:
        cluster:
          singleNode: true
          # One node: a second instance only doubles disk writes, no failover
          instances: 1
        monitoring:
          enablePodMonitor: true
        mode: recovery
        backups:
          enabled: true
          credentials: minio
          scheduledBackups:
            - name: daily-backup
              schedule: "0 5 0 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
        recovery:
          method: object_store
          credentials: minio
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                FRONT_URL: https://kitchenowl.${DOMAIN_1}
                # Login via Authelia OIDC: https://docs.kitchenowl.org/latest/self-hosting/oidc/
                # Existing users link their account in Settings -> profile -> Linked Accounts (permanent!)
                OIDC_ISSUER: https://auth.${DOMAIN_1}
                OIDC_CLIENT_ID: kitchenowl
                OIDC_CLIENT_SECRET:
                  secretKeyRef:
                    expandObjectName: false
                    name: kitchenowl-oidc
                    key: OIDC_CLIENT_SECRET
                DISABLE_USERNAME_PASSWORD_LOGIN: "true"
                SMTP_HOST: ${SMTP_HOST}
                SMTP_PORT: 465
                SMTP_USER: ${SMTP_USER}
                SMTP_PASS: ${SMTP_PASSWORD}
                SMTP_FROM: kitchenowl@${DOMAIN_1}
