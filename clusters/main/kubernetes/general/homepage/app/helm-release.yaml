apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: homepage
    namespace: homepage
spec:
  interval: 5m
  chart:
    spec:
      chart: homepage
      version: 14.3.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 5m
  values:
    global:
      stopAll: false
    credentials:
      minio:
        type: s3
        url: "http://${S3_URL}"
        bucket: "${S3_BUCKET}-homepage"
        accessKey: "${S3_ACCESS_KEY}"
        secretKey: "${S3_SECRET_KEY}"
        encrKey: "${S3_ENCRYPTION_KEY}"
    ingress:
      main:
        enabled: true
        ingressClassName: external
        # Login via Authelia OIDC (see env below), no forward-auth
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-1-le-prod
        hosts:
          - host: home.${DOMAIN_1}
    addons:
      codeserver:
        enabled: true
        ingress:
          enabled: true
          ingressClassName: internal
          hosts:
          - host: homepage.code.${DOMAIN_1}
          integrations:
            nginx:
              enabled: true
              auth:
                type: "authelia"
                internalHost: "authelia.authelia.svc.cluster.local:9091"
                externalHost: "auth.${DOMAIN_1}"
            certManager:
              certificateIssuer: domain-1-le-prod
              enabled: true
    persistence:
      config:
        volsync:
        - name: config
          type: restic
          credentials: minio
          dest:
            enabled: true
          src:
            enabled: true
            trigger:
              schedule: 10 0 * * *
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                HOMEPAGE_ALLOWED_HOSTS: home.${DOMAIN_1}
                # https://gethomepage.dev/installation/#security-authentication
                HOMEPAGE_AUTH_ENABLED: "true"
                HOMEPAGE_EXTERNAL_URL: https://home.${DOMAIN_1}
                HOMEPAGE_OIDC_ISSUER: https://auth.${DOMAIN_1}
                HOMEPAGE_OIDC_CLIENT_ID: homepage
                HOMEPAGE_OIDC_NAME: Authelia
                HOMEPAGE_OIDC_AUTO_LOGIN: "true"
                HOMEPAGE_AUTH_SECRET:
                  secretKeyRef:
                    expandObjectName: false
                    name: homepage-oidc
                    key: HOMEPAGE_AUTH_SECRET
                HOMEPAGE_OIDC_CLIENT_SECRET:
                  secretKeyRef:
                    expandObjectName: false
                    name: homepage-oidc
                    key: HOMEPAGE_OIDC_CLIENT_SECRET
    
