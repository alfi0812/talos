apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  interval: 5m
  chart:
    spec:
      chart: vaultwarden
      version: 31.0.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 5m
  values:
    global:
      stopAll: false
    credentials:
      minio:
        type: s3
        url: "http://${S3_URL}"
        bucket: "${S3_BUCKET}-vaultwarden"
        accessKey: "${S3_ACCESS_KEY}"
        secretKey: "${S3_SECRET_KEY}"
        encrKey: "${S3_ENCRYPTION_KEY}"
    ingress:
      main:
        enabled: true
        ingressClassName: external
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-1-le-prod
        hosts:
          - host: vault.${DOMAIN_1}
      admin:
        enabled: true
        ingressClassName: external
        primary: false
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 403"]
        targetSelector:
          main: main
        integrations:
          nginx:
            enabled: true
            ipWhitelist: ["${IP_WHITELIST}"]
            auth:
              type: "authelia"
              internalHost: "authelia.authelia.svc.cluster.local:9091"
              externalHost: "auth.${DOMAIN_1}"
          certManager:
            enabled: true
            certificateIssuer: domain-1-le-prod
        hosts:
          - host: vault.${DOMAIN_1}
            paths:
              - path: /admin
                pathType: Prefix
    persistence:
      data:
        volsync:
        - name: data
          type: restic
          credentials: minio
          dest:
            enabled: true
          src:
            enabled: true
            trigger:
              schedule: 40 1 * * *
    cnpg:
      main:
        cluster:
          singleNode: true
          # One node: a second instance only doubles disk writes, no failover
          instances: 1
        monitoring:
          enablePodMonitor: true
        mode: recovery
        backups:
          enabled: true
          credentials: minio
          scheduledBackups:
            - name: daily-backup
              schedule: "0 5 0 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
        recovery:
          method: object_store
          credentials: minio
    vaultwarden:
      admin:
        enabled: true
        token: ${VAULTWARDEN_ADMIN_TOKEN}
      allowSignups: false
      log:
        level: info
      push:
        enabled: true
        installationId: ${VAULTWARDEN_PUSH_ID}
        installationKey: ${VAULTWARDEN_PUSH_KEY}
      yubico:
        clientId: ${YUBICO_ID}
        enabled: true
        secretKey: ${YUBICO_SECRET}
        server: ''
      smtp:
        enabled: true
        host: ${SMTP_HOST}
        from: vaultwarden@${DOMAIN_1}
        port: 587
        security: starttls
        user: ${SMTP_USER}
        password: ${SMTP_PASSWORD}

    workload:
      main:
        podSpec:
          containers:
            main:
              advanced: false
              env:
                # SSO via Authelia: https://github.com/dani-garcia/vaultwarden/wiki/Enabling-SSO-support-using-OpenId-Connect
                # Existing accounts are linked by email on the first SSO login (SSO_SIGNUPS_MATCH_EMAIL,
                # default true); the master password still unlocks the vault
                SSO_ENABLED: "true"
                # Keep email + master password login for existing apps/devices
                SSO_ONLY: "false"
                # New accounts only via SSO (Authelia 'members' policy); the register form
                # stays off through vaultwarden.allowSignups: false (SIGNUPS_ALLOWED)
                SSO_SIGNUPS_ALLOWED: "true"
                SSO_AUTHORITY: https://auth.${DOMAIN_1}
                SSO_SCOPES: openid profile email offline_access
                SSO_CLIENT_ID: vaultwarden
                SSO_CLIENT_SECRET:
                  secretKeyRef:
                    expandObjectName: false
                    name: vaultwarden-oidc
                    key: SSO_CLIENT_SECRET
