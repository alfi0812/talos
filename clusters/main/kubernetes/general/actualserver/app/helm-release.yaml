apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actualserver
  namespace: actualserver
spec:
  interval: 5m
  chart:
    spec:
      chart: actualserver
      version: 17.0.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 5m
  values:
    global:
      stopAll: false
    credentials:
      minio:
        type: s3
        url: "http://${S3_URL}"
        bucket: "${S3_BUCKET}-actualserver"
        accessKey: "${S3_ACCESS_KEY}"
        secretKey: "${S3_SECRET_KEY}"
        encrKey: "${S3_ENCRYPTION_KEY}"
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        # Login via Authelia OIDC (see env below), no forward-auth
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-1-le-prod
        hosts:
          - host: actual.${DOMAIN_1}
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                # https://actualbudget.org/docs/config/oauth-auth
                # On startup Actual switches its login method to OpenID; the first OpenID login
                # becomes owner and takes over the budget files of the former password user.
                ACTUAL_OPENID_DISCOVERY_URL: https://auth.${DOMAIN_1}
                ACTUAL_OPENID_SERVER_HOSTNAME: https://actual.${DOMAIN_1}
                ACTUAL_OPENID_CLIENT_ID: actual-budget
                ACTUAL_OPENID_CLIENT_SECRET:
                  secretKeyRef:
                    expandObjectName: false
                    name: actualserver-oidc
                    key: ACTUAL_OPENID_CLIENT_SECRET
                # As in Authelia's tested integration guide
                ACTUAL_OPENID_AUTH_METHOD: oauth2
                # Only users created in Actual (matching LLDAP username) may log in
                ACTUAL_USER_CREATION_MODE: manual
    persistence:
      data:
        volsync:
        - name: data
          type: restic
          credentials: minio
          dest:
            enabled: true
          src:
            enabled: true
            trigger:
              schedule: 10 0 * * *
