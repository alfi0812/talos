apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 5m
  chart:
    spec:
      chart: nextcloud
      version: 49.2.6
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 5m
  timeout: 20m
  values:
    global:
      stopAll: false
    credentials:
      minio:
        type: s3
        url: "http://${S3_URL}"
        bucket: "${S3_BUCKET}-nextcloud"
        accessKey: "${S3_ACCESS_KEY}"
        secretKey: "${S3_SECRET_KEY}"
        encrKey: "${S3_ENCRYPTION_KEY}"
    ingress:
      main:
        enabled: true
        ingressClassName: external
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-1-le-prod
        hosts:
          - host: nextcloud.${DOMAIN_1}
            paths:
              - path: /
                pathType: Prefix
      admin:
        enabled: true
        ingressClassName: external
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 403"]
        targetSelector:
          collabora: collabora
        integrations:
          nginx:
            enabled: true
            ipWhitelist: ["${IP_WHITELIST}"]
            auth:
                type: "authelia"
                internalHost: "authelia.authelia.svc.cluster.local:9091"
                externalHost: "auth.${DOMAIN_1}"
          certManager:
            enabled: true
            certificateIssuer: domain-1-le-prod
        hosts:
          - host: nextcloud.${DOMAIN_1}
            paths:
              - path: /collabora/browser/dist/admin
                pathType: Prefix
    cnpg:
      main:
        cluster:
          singleNode: true
          # One node: a second instance only doubles disk writes, no failover
          instances: 1
        monitoring:
          enablePodMonitor: true
        mode: recovery
        backups:
          enabled: true
          credentials: minio
          scheduledBackups:
            - name: daily-backup
              schedule: "0 5 0 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
        recovery:
          method: object_store
          credentials: minio
    persistence:
      config:
        volsync:
        - name: config
          type: restic
          credentials: minio
          dest:
            enabled: true
          src:
            enabled: true
            trigger:
              schedule: 10 1 * * *
      logs:
        targetSelector:
          main:
            main:
              mountPath: /var/log/nextcloud
          nextcloud-cron:
            nextcloud-cron:
              mountPath: /var/log/nextcloud
          preview-cron:
            preview-cron:
              mountPath: /var/log/nextcloud
      data:
        enabled: true
        type: nfs
        path: /${NEXTCLOUD_NFS_PATH}
        server: ${CONFIG_TRUENAS_IP}
      html:
        volsync:
        - name: html
          type: restic
          credentials: minio
          dest:
            enabled: true
          src:
            enabled: true
            trigger:
              schedule: 20 1 * * *
    workload:
      main:
        podSpec:
          containers:
            main:
              resources:
                limits:
                  memory: 6Gi
      imaginary:
        podSpec:
          containers:
            imaginary:
              resources:
                limits:
                  # autorotate fully decodes 108MP photos (~0.3-0.65GB each) at concurrency 10
                  memory: 8Gi
    nextcloud:
      # Chart default (180 children) lets a sync burst outgrow the memory limit
      php:
        pm_max_children: 40
        pm_start_servers: 6
        pm_min_spare_servers: 4
        pm_max_spare_servers: 10
      collabora:
        enabled: true
      credentials:
        initialAdminPassword: "${NEXTCLOUD_PASSWORD}"
        initialAdminUser: "${NEXTCLOUD_USER}"
      general:
        accessIP: ${NGINX_EXTERNAL_IP}
        default_phone_region: DE
      # Chart 49.2.6 mounts logs inside data/, which is root-squashed NFS here: runc can't create the mountpoint
      logging:
        log_file: /var/log/nextcloud/nextcloud.log
        log_audit_file: /var/log/nextcloud/audit.log
      previews:
        # Let imaginary (libvips) handle 108MP phone photos instead of rejecting them (422),
        # which made PHP decode them in-process at ~0.5GB each and OOMKill the pod
        max_allowed_resolution: 120.0
        # Nextcloud default; PHP fallback skips huge images instead of decoding them
        max_memory: 256
        providers:
        - BMP
        - GIF
        - JPEG
        - Krita
        - MarkDown
        - MP3
        - OpenDocument
        - PNG
        - TXT
        - XBitmap
