apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chromium
  namespace: chromium
spec:
  interval: 5m
  chart:
      spec:
        chart: chromium
        version: 10.0.4
        sourceRef:
          kind: HelmRepository
          name: truecharts
          namespace: flux-system
        interval: 5m
  values:
    global:
      stopAll: false
    TZ: Europe/Berlin
    image:
      repository: ghcr.io/linuxserver/chromium
      tag: latest@sha256:f2d4b8b284918d8d65e10921e2fc84c57fd7edbc15345ddb3c024f0949f0031c
    service:
      main:
        ports:
          main:
            port: 3000
            targetPort: 3000
    credentials:
      minio:
        type: s3
        url: "http://${S3_URL}"
        bucket: "${S3_BUCKET}-chromium"
        accessKey: "${S3_ACCESS_KEY}"
        secretKey: "${S3_SECRET_KEY}"
        encrKey: "${S3_ENCRYPTION_KEY}"
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        integrations:
          nginx:
            enabled: true
            auth:
              type: "authelia"
              internalHost: "authelia.authelia.svc.cluster.local:9091"
              externalHost: "auth.${DOMAIN_1}"
          certManager:
            enabled: true
            certificateIssuer: domain-1-le-prod
        hosts:
          - host: chrome.${DOMAIN_1}
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                CUSTOM_RES_H: null
                CUSTOM_RES_W: null
                EXTRA_PARAMETERS: null
              resources:
                limits:
                  gpu.intel.com/i915: 1
    persistence:
      browsercache:
        enabled: true
        type: emptyDir
        mountPath: /config/.cache
      datadir:
        mountPath: /config
        volsync:
        - name: datadir
          type: restic
          credentials: minio
          dest:
            enabled: true
          src:
            enabled: true
            trigger:
              schedule: 10 0 * * *
