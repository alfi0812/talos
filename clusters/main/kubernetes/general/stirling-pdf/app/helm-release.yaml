apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
spec:
  interval: 5m
  chart:
    spec:
      chart: stirling-pdf
      version: 13.3.9
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 5m
  values:
    workload:
      main:
        podSpec:
          containers:
            main:
              imageSelector: fullImage
              env:
                LANGS: en_US, de_DE
                INSTALL_BOOK_AND_ADVANCED_HTML_OPS: true
    ingress:
      main:
        enabled: true
        ingressClassName: external
        integrations:
          nginx:
            enabled: true
            auth:
              type: "authelia"
              internalHost: "authelia.authelia.svc.cluster.local:9091"
              externalHost: "auth.${DOMAIN_1}"
          certManager:
            enabled: true
            certificateIssuer: domain-1-le-prod
        hosts:
          - host: pdf.${DOMAIN_1}
