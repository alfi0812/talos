apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
spec:
  interval: 5m
  chart:
    spec:
      chart: stirling-pdf
      version: 13.3.9
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 5m
  values:
    credentials:
      minio:
        type: s3
        url: "http://${S3_URL}"
        bucket: "${S3_BUCKET}-stirling-pdf"
        accessKey: "${S3_ACCESS_KEY}"
        secretKey: "${S3_SECRET_KEY}"
        encrKey: "${S3_ENCRYPTION_KEY}"
    persistence:
      # settings.yml + user database (SSO users and their roles)
      configs:
        volsync:
          - name: configs
            type: restic
            credentials: minio
            dest:
              enabled: true
            src:
              enabled: true
              trigger:
                schedule: 0 2 * * *
    workload:
      main:
        podSpec:
          containers:
            main:
              imageSelector: fullImage
              env:
                LANGS: en_US, de_DE
                INSTALL_BOOK_AND_ADVANCED_HTML_OPS: true
                # Login via Authelia OIDC: https://docs.stirlingpdf.com/Server/Security/OAuth-SSO/
                DOCKER_ENABLE_SECURITY: "true"
                SECURITY_ENABLELOGIN: "true"
                # SSO only; set back to 'all' to use the local fallback admin (local_admin)
                SECURITY_LOGINMETHOD: oauth2
                # Skip the login page and go straight to Authelia
                SECURITY_SSOAUTOLOGIN: "true"
                # Must not collide with an LLDAP username (SSO users are named after preferred_username)
                SECURITY_INITIALLOGIN_USERNAME: local_admin
                SECURITY_OAUTH2_ENABLED: "true"
                SECURITY_OAUTH2_PROVIDER: authelia
                SECURITY_OAUTH2_ISSUER: https://auth.${DOMAIN_1}
                SECURITY_OAUTH2_CLIENTID: stirling-pdf
                SECURITY_OAUTH2_CLIENTSECRET:
                  secretKeyRef:
                    expandObjectName: false
                    name: stirling-pdf-oidc
                    key: SECURITY_OAUTH2_CLIENTSECRET
                SECURITY_OAUTH2_SCOPES: openid, profile, email
                SECURITY_OAUTH2_USEASUSERNAME: preferred_username
                SECURITY_OAUTH2_AUTOCREATEUSER: "true"
                SECURITY_OAUTH2_BLOCKREGISTRATION: "false"
                SECURITY_OAUTH2_REDIRECTBASEURL: https://pdf.${DOMAIN_1}
    ingress:
      main:
        enabled: true
        ingressClassName: external
        # Login via Authelia OIDC (see env above), no forward-auth
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-1-le-prod
        hosts:
          - host: pdf.${DOMAIN_1}
