---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: speedtest-exporter-rules
  namespace: speedtest-exporter
spec:
  groups:
    - name: speedtest-exporter.rules
      rules:
        - alert: SpeedtestExporterAbsent
          annotations:
            description: Speedtest Exporter has disappeared from Prometheus target discovery.
            summary: Speedtest Exporter is down.
          # The exporter is scraped hourly, so 'up' goes stale between scrapes: look back over
          # 75m instead of using absent() with 'for', which went pending after every scrape
          expr: |
            (max_over_time(up{job=~".*speedtest-exporter.*"}[75m]) == 0)
              or absent_over_time(up{job=~".*speedtest-exporter.*"}[75m])
          for: 0m
          labels:
            severity: critical
        # Median over 4h (~4 hourly tests): one bad test no longer fires an alert, two do
        - alert: SpeedtestSlowInternetDownload
          annotations:
            description: Internet download speed has a median of {{ humanize $value }} Mbps.
            summary: SpeedTest slow internet download.
          expr: |
            quantile_over_time(0.5, speedtest_download_bits_per_second{job=~".*speedtest-exporter.*"}[4h])
              < 240e6
          for: 0m
          labels:
            severity: warning
        - alert: SpeedtestSlowInternetUpload
          annotations:
            description: Internet upload speed has a median of {{ humanize $value }} Mbps.
            summary: SpeedTest slow internet upload.
          expr: |
            quantile_over_time(0.5, speedtest_upload_bits_per_second{job=~".*speedtest-exporter.*"}[4h])
              < 140e6
          for: 0m
          labels:
            severity: warning
        - alert: SpeedtestHighPingLatency
          annotations:
            description: Internet ping latency has a median of {{ humanize $value }} ms.
            summary: SpeedTest high ping latency.
          expr: |
            quantile_over_time(0.5, speedtest_ping_latency_milliseconds{job=~".*speedtest-exporter.*"}[4h])
              > 20
          for: 0m
          labels:
            severity: warning
        - alert: SpeedtestHighJitterLatency
          annotations:
            description: Internet jitter latency has a median of {{ humanize $value }} ms.
            summary: SpeedTest high jitter latency.
          expr: |
            quantile_over_time(0.5, speedtest_jitter_latency_milliseconds{job=~".*speedtest-exporter.*"}[4h])
              > 30
          for: 0m
          labels:
            severity: warning
