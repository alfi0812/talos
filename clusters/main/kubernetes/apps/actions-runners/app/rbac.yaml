---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: actions-runners
  namespace: gha
# The runner only talks to the Talos API, not to Kubernetes
automountServiceAccountToken: false
---
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: actions-runners
  namespace: gha
spec:
  roles:
    # Enough for `talosctl image pull`
    - os:operator
