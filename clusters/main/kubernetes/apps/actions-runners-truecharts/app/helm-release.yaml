---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actions-runners-truecharts
  namespace: gha-truecharts
spec:
  interval: 15m
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.15.1
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: enabled
  uninstall:
    keepHistory: false
  values:
    minRunners: 4
    maxRunners: 6
    githubConfigSecret: runner-secret-truecharts
    githubConfigUrl: https://github.com/trueforge-org
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: gha
    containerMode:
      type: kubernetes
    template:
      spec:
        volumes:
          - name: config
            emptyDir: {}
          - name: tmp
            emptyDir: {}
          - name: work
            emptyDir: {}
        containers:
          - name: runner
            image: oci.trueforge.org/containerforge/actions-runner:2.338.2@sha256:b35b3b2a542e15eb77d4c9a0c5727f661bea5bb07f58682029747676b6a23959
            command:
              - /home/runner/run.sh
            env:
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
            volumeMounts:
              - name: config
                mountPath: /config
              - name: tmp
                mountPath: /tmp
              - name: work
                mountPath: /home/runner/_work
