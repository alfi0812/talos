apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-service-kvm-truenas
  namespace: external-service
spec:
  interval: 5m
  chart:
    spec:
      chart: external-service
      version: 18.0.6
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 5m
  values:
    service:
      main:
        enabled: true
        externalIP: ${KVM_TRUENAS_IP}
        ports:
          main:
            enabled: true
            port: 80
            protocol: http
        type: ExternalIP
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
        - host: truenas-kvm.${DOMAIN_1}
        integrations:
          nginx:
            enabled: true
            auth:
              type: "authelia"
              internalHost: "authelia.authelia.svc.cluster.local:9091"
              externalHost: "auth.${DOMAIN_1}"
          certManager:
            certificateIssuer: domain-1-le-prod
            enabled: true
