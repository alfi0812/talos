apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
  namespace: media
spec:
  interval: 5m
  chart:
    spec:
      chart: radarr
      version: 29.0.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 5m
  values:
    global:
      stopAll: false
    credentials:
      minio:
        type: s3
        url: "http://${S3_URL}"
        bucket: "${S3_BUCKET}-radarr"
        accessKey: "${S3_ACCESS_KEY}"
        secretKey: "${S3_SECRET_KEY}"
        encrKey: "${S3_ENCRYPTION_KEY}"
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        # Login via Authelia OIDC (see env below), no forward-auth
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-1-le-prod
        hosts:
          - host: radarr.${DOMAIN_1}
    metrics:
      main:
        enabled: true
    resources:
      limits:
        cpu: 4000m
        memory: 4Gi
      requests:
        cpu: 1000m
        memory: 1Gi 
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                RADARR__LOG__LEVEL: info
                # Keep only file logs; no separate log database in Postgres
                RADARR__LOG__DBENABLED: "false"
                RADARR__POSTGRES__HOST:
                  secretKeyRef:
                    name: cnpg-main-urls
                    key: host
                RADARR__POSTGRES__PORT: "5432"
                RADARR__POSTGRES__USER: radarr
                RADARR__POSTGRES__PASSWORD:
                  secretKeyRef:
                    name: cnpg-main-user
                    key: password
                RADARR__POSTGRES__MAINDB: radarr
                # Login via Authelia OIDC (Radarr v7); only the one user in OIDCUSERIDENTIFIER gets in
                RADARR__AUTH__METHOD: Oidc
                # No forward-auth anymore: never skip auth for "local" (= any LAN) addresses
                RADARR__AUTH__REQUIRED: Enabled
                # Trust X-Forwarded-Proto/Host from nginx (pod network), so the OIDC
                # redirect_uri is https://<host>/signin-oidc instead of http://
                RADARR__SERVER__TRUSTEDNETWORKS: ${PODNET}
                RADARR__AUTH__OIDCAUTHORITY: https://auth.${DOMAIN_1}
                RADARR__AUTH__OIDCCLIENTID: radarr
                RADARR__AUTH__OIDCCLIENTSECRET:
                  secretKeyRef:
                    expandObjectName: false
                    name: radarr-oidc
                    key: RADARR__AUTH__OIDCCLIENTSECRET
                RADARR__AUTH__OIDCUSERIDENTIFIER:
                  secretKeyRef:
                    expandObjectName: false
                    name: radarr-oidc
                    key: RADARR__AUTH__OIDCUSERIDENTIFIER
    persistence:
      config:
        volsync:
        - name: config
          type: restic
          credentials: minio
          dest:
            enabled: true
          src:
            enabled: true
            trigger:
              schedule: 40 0 * * *
      media:
        enabled: true
        existingClaim: media-nfs-pvc
        mountPath: /Media     
    cnpg:
      main:
        enabled: true
        user: radarr
        database: radarr
        mode: recovery
        cluster:
          singleNode: true
          # One node: a second instance only doubles disk writes, no failover
          instances: 1
        monitoring:
          enablePodMonitor: true
        backups:
          enabled: true
          credentials: minio
          scheduledBackups:
            - name: daily-backup
              schedule: "0 15 0 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
        recovery:
          method: object_store
          credentials: minio
