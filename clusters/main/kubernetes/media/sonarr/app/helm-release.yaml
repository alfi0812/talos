apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
  namespace: media
spec:
  interval: 5m
  chart:
    spec:
      chart: sonarr
      version: 28.0.7
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 5m
  values:
    global:
      stopAll: false
    credentials:
      minio:
        type: s3
        url: "http://${S3_URL}"
        bucket: "${S3_BUCKET}-sonarr"
        accessKey: "${S3_ACCESS_KEY}"
        secretKey: "${S3_SECRET_KEY}"
        encrKey: "${S3_ENCRYPTION_KEY}"
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        integrations:
          nginx:
            enabled: true
            auth:
              type: "authelia"
              internalHost: "authelia.authelia.svc.cluster.local:9091"
              externalHost: "auth.${DOMAIN_1}"
          certManager:
            enabled: true
            certificateIssuer: domain-1-le-prod
        hosts:
          - host: sonarr.${DOMAIN_1}
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                SONARR__LOG__LEVEL: info
                # Keep only file logs; no separate log database in Postgres
                SONARR__LOG__DBENABLED: "False"
                SONARR__POSTGRES__HOST:
                  secretKeyRef:
                    name: cnpg-main-urls
                    key: host
                SONARR__POSTGRES__PORT: "5432"
                SONARR__POSTGRES__USER: sonarr
                SONARR__POSTGRES__PASSWORD:
                  secretKeyRef:
                    name: cnpg-main-user
                    key: password
                SONARR__POSTGRES__MAINDB: sonarr
    persistence:
      config:
        volsync:
        - name: config
          type: restic
          credentials: minio
          dest:
            enabled: true
          src:
            enabled: true
            trigger:
              schedule: 50 0 * * *
      media:
        enabled: true
        existingClaim: media-nfs-pvc
        mountPath: /Media
    cnpg:
      main:
        enabled: true
        user: sonarr
        database: sonarr
        mode: recovery
        cluster:
          singleNode: true
          # One node: a second instance only doubles disk writes, no failover
          instances: 1
        monitoring:
          enablePodMonitor: true
        backups:
          enabled: true
          credentials: minio
          scheduledBackups:
            - name: daily-backup
              schedule: "0 20 0 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
        recovery:
          method: object_store
          credentials: minio
