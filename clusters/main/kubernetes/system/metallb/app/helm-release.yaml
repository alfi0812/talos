apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb
spec:
  interval: 5m
  chart:
    spec:
      chart: metallb
      version: 0.16.2
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
      interval: 5m
  values:
    speaker:
      ignoreExcludeLB: true
    prometheus:
      rbacPrometheus: false
      serviceMonitor:
        enabled: true
  # Single-node cluster: statuscleaner uses hostNetwork + port 19443, so a
  # RollingUpdate can never schedule the new pod while the old one holds the
  # port. Recreate stops the old pod first.
  # https://github.com/metallb/metallb/issues/3184
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: metallb-frr-k8s-statuscleaner
            patch: |
              - op: add
                path: /spec/strategy
                value:
                  type: Recreate
