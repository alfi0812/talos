---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: authelia
spec:
  interval: 15m
  chart:
    spec:
      chart: authelia
      version: 34.0.10
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 5m
  maxHistory: 3
  uninstall:
    keepHistory: false
  dependsOn:
    - name: lldap
      namespace: lldap
  # OIDC clients live in oidc-clients.yaml
  valuesFrom:
    - kind: ConfigMap
      name: authelia-oidc-clients
      valuesKey: values.yaml
  values:
    credentials:
      minio:
          type: s3
          url: "http://${S3_URL}"
          bucket: "${S3_BUCKET}-authelia"
          accessKey: "${S3_ACCESS_KEY}"
          secretKey: "${S3_SECRET_KEY}"
          encrKey: "${S3_ENCRYPTION_KEY}"
    ingress:
        main:
          enabled: true
          ingressClassName: external
          integrations:
            certManager:
              enabled: true
              certificateIssuer: domain-1-le-prod
          hosts:
            - host: auth.${DOMAIN_1}
        # Second login URL so Authelia can set its session cookie on DOMAIN_0
        domain0:
          enabled: true
          ingressClassName: external
          integrations:
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
          hosts:
            - host: auth.${DOMAIN_0}
    cnpg:
      main:
        mode: recovery
        cluster:
          singleNode: true
          # One node: a second instance only doubles disk writes, no failover
          instances: 1
        monitoring:
          enablePodMonitor: true
        backups:
          enabled: true
          credentials: minio
          scheduledBackups:
            - name: daily-backup
              schedule: "0 5 0 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
        recovery:
          method: object_store
          credentials: minio
    persistence:
      # OIDC signing key + HMAC secret (SOPS, oidc.secret.yaml), loaded as a second config file
      oidc:
        enabled: true
        type: secret
        objectName: authelia-oidc
        expandObjectName: false
        mountPath: /secrets/oidc
        readOnly: true
      config:
        volsync:
          - name: config
            type: restic
            credentials: minio
            dest:
              enabled: true
            src:
              enabled: true
              trigger:
                schedule: 10 0 * * *
    workload:
      main:
        replicas: 1
        podSpec:
          containers:
            main:
              env:
                AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_KEY}
                AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_KEY}
                AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_ENCRYPTION_KEY}
                # Merge the secret OIDC config (keys) into the main config
                X_AUTHELIA_CONFIG: "/configuration.yaml,/secrets/oidc/oidc.yaml"
    authelia:
      server:
        buffers:
          read: 16384
          write: 16384
      theme: auto
      totp:
        issuer: ${DOMAIN_1}
      authentication_backend:
        ldap:
          address: ldap://lldap-ldap.lldap.svc.cluster.local:3890
          tls:
            server_name: lldap.${DOMAIN_1}
          base_dn: DC=${DN},DC=${DC}
          attributes:
            username: uid
          additional_users_dn: ou=people
          users_filter: (&(|({username_attribute}={input})({mail_attribute}={input}))(objectClass=person))
          additional_groups_dn: ou=groups
          groups_filter: (member={dn})
          user: uid=admin,ou=people,dc=${DN},dc=${DC}
          password: ${LLDAP_PASSWORD}
      access_control:
        default_policy: 'deny'
        rules:
        - domain:
            - ${DOMAIN_0}
            - '*.${DOMAIN_0}'
            - ${DOMAIN_1}
            - '*.${DOMAIN_1}'
          policy: two_factor
          subject:
            - 'group:admin'
      # identity_providers.oidc: policies + clients in oidc-clients.yaml (valuesFrom),
      # hmac_secret + jwks in oidc.secret.yaml (mounted as second config file).
      # Do not add an empty identity_providers/oidc key here: it would override valuesFrom.
      session:
        cookies:
          - domain: '${DOMAIN_0}'
            authelia_url: 'https://auth.${DOMAIN_0}'
          - domain: '${DOMAIN_1}'
            authelia_url: 'https://auth.${DOMAIN_1}'
            default_redirection_url: 'https://www.${DOMAIN_1}'
      regulation:
        find_time: 10m
        ban_time: 12h
      notifier:
        smtp:
          address: 'smtp://${SMTP_HOST}:587'
          username: ${SMTP_USER}
          password: ${SMTP_PASSWORD}
          sender: auth@${DOMAIN_1}
          startup_check_address: auth@${DOMAIN_1}
          disable_html_emails: true
          tls:
            server_name: ${SMTP_HOST}
