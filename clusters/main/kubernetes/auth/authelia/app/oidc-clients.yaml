# OIDC clients for Authelia, merged into the HelmRelease values via spec.valuesFrom.
# Keep all clients in this one file: lists are not merged across value sources.
# Client secrets are PBKDF2 hashes; plaintext lives in each app's oidc.secret.yaml.
authelia:
  identity_providers:
    oidc:
      clients:
        # https://gethomepage.dev/installation/#security-authentication
        - client_id: 'homepage'
          client_name: 'Homepage'
          # PBKDF2 hash; plaintext lives in general/homepage/app/oidc.secret.yaml
          client_secret: '$pbkdf2-sha512$310000$.73vCp9WK2P7qwibTUf.Bg$yt2aP.rd61vj8tQGrNcBRhl81kfiXHQW57l/d3kEjoINsVm8QcJhl70IdCe1CCTsILyWLgEcn9BRZiZ0sNI63A'
          public: false
          authorization_policy: 'admins'
          consent_mode: 'implicit'
          redirect_uris:
            - 'https://home.${DOMAIN_1}/api/auth/callback/homepage-oidc'
          scopes:
            - 'openid'
            - 'email'
            - 'profile'
          grant_types:
            - 'authorization_code'
          response_types:
            - 'code'
          token_endpoint_auth_method: 'client_secret_basic'
        # https://docs.stirlingpdf.com/Server/Security/OAuth-SSO/
        - client_id: 'stirling-pdf'
          client_name: 'Stirling-PDF'
          # PBKDF2 hash; plaintext lives in general/stirling-pdf/app/oidc.secret.yaml
          client_secret: '$pbkdf2-sha512$310000$TbBxlfiZgpfDF4SrnDjkLA$QlCIkI00VWFouCi8ex9hMrUtB5fpyHjBp8G0IvKbiTacHhecsGF3dOW7i2m9dwf1o8SthxmhR1ipEkiKi1JBhg'
          public: false
          authorization_policy: 'members'
          consent_mode: 'implicit'
          redirect_uris:
            - 'https://pdf.${DOMAIN_1}/login/oauth2/code/authelia'
          scopes:
            - 'openid'
            - 'email'
            - 'profile'
          grant_types:
            - 'authorization_code'
          response_types:
            - 'code'
          token_endpoint_auth_method: 'client_secret_basic'
        # https://wg-easy.github.io/wg-easy/latest/advanced/config/external-authentication/
        - client_id: 'wg-easy'
          client_name: 'wg-easy'
          # PBKDF2 hash; plaintext lives in networking/wg-easy/app/oidc.secret.yaml
          client_secret: '$pbkdf2-sha512$310000$MIKq27sbyoPOQfgzEifoIg$2ETMS4YUoEPZZ8bYuUeI4vNTm/PbsI6Hwk/xb6rIe4Du3pLv05YDWNu3jC7C/o23HTe1PNQCivX0NhByVRD/WQ'
          public: false
          authorization_policy: 'admins'
          consent_mode: 'implicit'
          require_pkce: true
          pkce_challenge_method: 'S256'
          redirect_uris:
            - 'https://vpn.${DOMAIN_1}/api/auth/oidc/callback'
            - 'https://vpn.${DOMAIN_1}/api/auth/oidc/link'
          scopes:
            - 'openid'
            - 'email'
            - 'profile'
          grant_types:
            - 'authorization_code'
          response_types:
            - 'code'
          token_endpoint_auth_method: 'client_secret_post'
        # https://www.authelia.com/integration/openid-connect/clients/grafana/
        - client_id: 'grafana'
          client_name: 'Grafana'
          # PBKDF2 hash; plaintext lives in observability/grafana/app/oidc.secret.yaml
          client_secret: '$pbkdf2-sha512$310000$NkkiBXk3buqm/DkE6R/VPg$juuuBly0Ec5hNaV/QnN0xDTLFx0kvBso6N0S/oZtYv0/9tz5PRwq.v3bTnCpft8WWBs5w6wz1VOKKlh82j7ywA'
          public: false
          authorization_policy: 'admins'
          consent_mode: 'implicit'
          require_pkce: true
          pkce_challenge_method: 'S256'
          redirect_uris:
            - 'https://grafana.${DOMAIN_1}/login/generic_oauth'
          scopes:
            - 'openid'
            - 'profile'
            - 'email'
            - 'groups'
          grant_types:
            - 'authorization_code'
          response_types:
            - 'code'
          token_endpoint_auth_method: 'client_secret_basic'
          userinfo_signed_response_alg: 'none'
        # https://www.authelia.com/integration/openid-connect/clients/actual-budget/
        - client_id: 'actual-budget'
          client_name: 'Actual Budget'
          # PBKDF2 hash; plaintext lives in general/actualserver/app/oidc.secret.yaml
          client_secret: '$pbkdf2-sha512$310000$Grl3TtAZeE6n1YlF.KTFhg$ZiqF/ZIMgVFx3jJkXQehJqJvbYtS.cq.cKi258WiTDxFMItoSttGVNJq1i9WnetR5kxQ/Uo8e5Q..hir6QsymQ'
          public: false
          authorization_policy: 'admins'
          consent_mode: 'implicit'
          require_pkce: false
          pkce_challenge_method: ''
          redirect_uris:
            - 'https://actual.${DOMAIN_1}/openid/callback'
          scopes:
            - 'openid'
            - 'profile'
            - 'groups'
            - 'email'
          grant_types:
            - 'authorization_code'
          response_types:
            - 'code'
          access_token_signed_response_alg: 'none'
          userinfo_signed_response_alg: 'none'
          token_endpoint_auth_method: 'client_secret_basic'
