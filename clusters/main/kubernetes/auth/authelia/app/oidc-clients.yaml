# OIDC clients for Authelia, merged into the HelmRelease values via spec.valuesFrom.
# Keep all clients AND the policies they reference in this one file: lists are not merged across
# value sources, and a client must never arrive before the policy it references (Flux race).
# Client secrets are PBKDF2 hashes; plaintext lives in each app's oidc.secret.yaml.
authelia:
  identity_providers:
    oidc:
      claims_policies:
        # For apps that read the user only from the ID token (Authelia puts just 'sub' there by default)
        id_token_profile:
          id_token:
            - 'email'
            - 'email_verified'
            - 'preferred_username'
            - 'name'
      authorization_policies:
        # Admins only, with 2FA
        admins:
          default_policy: deny
          rules:
            - policy: two_factor
              subject: 'group:admin'
        # Admins with 2FA, regular users with password only
        members:
          default_policy: deny
          rules:
            - policy: two_factor
              subject: 'group:admin'
            - policy: one_factor
              subject: 'group:users'
      clients:
        # https://gethomepage.dev/installation/#security-authentication
        - client_id: 'homepage'
          client_name: 'Homepage'
          # PBKDF2 hash; plaintext lives in general/homepage/app/oidc.secret.yaml
          client_secret: '$pbkdf2-sha512$310000$.73vCp9WK2P7qwibTUf.Bg$yt2aP.rd61vj8tQGrNcBRhl81kfiXHQW57l/d3kEjoINsVm8QcJhl70IdCe1CCTsILyWLgEcn9BRZiZ0sNI63A'
          public: false
          authorization_policy: 'admins'
          consent_mode: 'implicit'
          redirect_uris:
            - 'https://home.${DOMAIN_1}/api/auth/callback/homepage-oidc'
          scopes:
            - 'openid'
            - 'email'
            - 'profile'
          grant_types:
            - 'authorization_code'
          response_types:
            - 'code'
          token_endpoint_auth_method: 'client_secret_basic'
        # https://docs.stirlingpdf.com/Server/Security/OAuth-SSO/
        - client_id: 'stirling-pdf'
          client_name: 'Stirling-PDF'
          # PBKDF2 hash; plaintext lives in general/stirling-pdf/app/oidc.secret.yaml
          client_secret: '$pbkdf2-sha512$310000$TbBxlfiZgpfDF4SrnDjkLA$QlCIkI00VWFouCi8ex9hMrUtB5fpyHjBp8G0IvKbiTacHhecsGF3dOW7i2m9dwf1o8SthxmhR1ipEkiKi1JBhg'
          public: false
          authorization_policy: 'members'
          consent_mode: 'implicit'
          redirect_uris:
            - 'https://pdf.${DOMAIN_1}/login/oauth2/code/authelia'
          scopes:
            - 'openid'
            - 'email'
            - 'profile'
          grant_types:
            - 'authorization_code'
          response_types:
            - 'code'
          token_endpoint_auth_method: 'client_secret_basic'
        # https://wg-easy.github.io/wg-easy/latest/advanced/config/external-authentication/
        - client_id: 'wg-easy'
          client_name: 'wg-easy'
          # PBKDF2 hash; plaintext lives in networking/wg-easy/app/oidc.secret.yaml
          client_secret: '$pbkdf2-sha512$310000$MIKq27sbyoPOQfgzEifoIg$2ETMS4YUoEPZZ8bYuUeI4vNTm/PbsI6Hwk/xb6rIe4Du3pLv05YDWNu3jC7C/o23HTe1PNQCivX0NhByVRD/WQ'
          public: false
          authorization_policy: 'admins'
          consent_mode: 'implicit'
          require_pkce: true
          pkce_challenge_method: 'S256'
          redirect_uris:
            - 'https://vpn.${DOMAIN_1}/api/auth/oidc/callback'
            - 'https://vpn.${DOMAIN_1}/api/auth/oidc/link'
          scopes:
            - 'openid'
            - 'email'
            - 'profile'
          grant_types:
            - 'authorization_code'
          response_types:
            - 'code'
          token_endpoint_auth_method: 'client_secret_post'
        # https://www.authelia.com/integration/openid-connect/clients/grafana/
        - client_id: 'grafana'
          client_name: 'Grafana'
          # PBKDF2 hash; plaintext lives in observability/grafana/app/oidc.secret.yaml
          client_secret: '$pbkdf2-sha512$310000$NkkiBXk3buqm/DkE6R/VPg$juuuBly0Ec5hNaV/QnN0xDTLFx0kvBso6N0S/oZtYv0/9tz5PRwq.v3bTnCpft8WWBs5w6wz1VOKKlh82j7ywA'
          public: false
          authorization_policy: 'admins'
          consent_mode: 'implicit'
          require_pkce: true
          pkce_challenge_method: 'S256'
          redirect_uris:
            - 'https://grafana.${DOMAIN_1}/login/generic_oauth'
          scopes:
            - 'openid'
            - 'profile'
            - 'email'
            - 'groups'
          grant_types:
            - 'authorization_code'
          response_types:
            - 'code'
          token_endpoint_auth_method: 'client_secret_basic'
          userinfo_signed_response_alg: 'none'
        # https://www.authelia.com/integration/openid-connect/clients/actual-budget/
        - client_id: 'actual-budget'
          client_name: 'Actual Budget'
          # PBKDF2 hash; plaintext lives in general/actualserver/app/oidc.secret.yaml
          client_secret: '$pbkdf2-sha512$310000$Grl3TtAZeE6n1YlF.KTFhg$ZiqF/ZIMgVFx3jJkXQehJqJvbYtS.cq.cKi258WiTDxFMItoSttGVNJq1i9WnetR5kxQ/Uo8e5Q..hir6QsymQ'
          public: false
          authorization_policy: 'admins'
          consent_mode: 'implicit'
          require_pkce: false
          pkce_challenge_method: ''
          redirect_uris:
            - 'https://actual.${DOMAIN_1}/openid/callback'
          scopes:
            - 'openid'
            - 'profile'
            - 'groups'
            - 'email'
          grant_types:
            - 'authorization_code'
          response_types:
            - 'code'
          access_token_signed_response_alg: 'none'
          userinfo_signed_response_alg: 'none'
          token_endpoint_auth_method: 'client_secret_basic'
        # https://docs.kitchenowl.org/latest/self-hosting/oidc/
        - client_id: 'kitchenowl'
          client_name: 'KitchenOwl'
          # KitchenOwl reads email/username from the ID token
          claims_policy: 'id_token_profile'
          # PBKDF2 hash; plaintext lives in general/kitchenowl/app/oidc.secret.yaml
          client_secret: '$pbkdf2-sha512$310000$klEZ7fSH5OfecLaUaN9oVg$JWHNaZ6hyyVbecPzESyOv1uHDXHUjhuPWgu6LPzS78CJpLeJSiPesWbOUoT0TWw/esrn2kJIdaIDU7hFOdwBHg'
          public: false
          authorization_policy: 'members'
          consent_mode: 'implicit'
          redirect_uris:
            - 'https://kitchenowl.${DOMAIN_1}/signin/redirect'
            # Mobile app
            - 'kitchenowl:/signin/redirect'
          scopes:
            - 'openid'
            - 'profile'
            - 'email'
          grant_types:
            - 'authorization_code'
          response_types:
            - 'code'
          token_endpoint_auth_method: 'client_secret_post'
        # Sonarr v5 OIDC (single allowed user, see SONARR__AUTH__OIDCUSERIDENTIFIER)
        - client_id: 'sonarr'
          client_name: 'Sonarr'
          # PBKDF2 hash; plaintext lives in media/sonarr/app/oidc.secret.yaml
          client_secret: '$pbkdf2-sha512$310000$kjM2xq.otpFiw67uOoUG/g$PxsMzJNs1R5W.fYHE0jh2EE1f7b06xNuNQ/3oE5Vjj/MflWe9onwkloABIH51e186Jvrjrj2xxIwI.PpRy4yxg'
          public: false
          authorization_policy: 'admins'
          consent_mode: 'implicit'
          redirect_uris:
            - 'https://sonarr.${DOMAIN_1}/signin-oidc'
          scopes:
            - 'openid'
            - 'profile'
            - 'email'
          grant_types:
            - 'authorization_code'
          response_types:
            - 'code'
          token_endpoint_auth_method: 'client_secret_post'
        # Sonarr v5 OIDC (single allowed user, see SONARR__AUTH__OIDCUSERIDENTIFIER)
        - client_id: 'sonarr-anime'
          client_name: 'Sonarr Anime'
          # PBKDF2 hash; plaintext lives in media/sonarr-anime/app/oidc.secret.yaml
          client_secret: '$pbkdf2-sha512$310000$/vuX4T.rydjzWtor59W2YA$6IXDXtOBgEQaRzWkPohTHMKqD6ZH0fAVhK6dm1Q8NI2Cqvr2RyBcfV6znpih2ykV6jNvuJYVHDslyLZxN8WC4g'
          public: false
          authorization_policy: 'admins'
          consent_mode: 'implicit'
          redirect_uris:
            - 'https://anime.${DOMAIN_1}/signin-oidc'
          scopes:
            - 'openid'
            - 'profile'
            - 'email'
          grant_types:
            - 'authorization_code'
          response_types:
            - 'code'
          token_endpoint_auth_method: 'client_secret_post'
        # Radarr v7 OIDC (single allowed user, see RADARR__AUTH__OIDCUSERIDENTIFIER)
        - client_id: 'radarr'
          client_name: 'Radarr'
          # PBKDF2 hash; plaintext lives in media/radarr/app/oidc.secret.yaml
          client_secret: '$pbkdf2-sha512$310000$hXUqilpiaGOQyd2ReSq1kA$OfMKd/cPmw8i7b8eh0dnZcgvPmLlowutTJHUKQgO2ob29omDfOeHBKVuyEsKjfKeIthnTBzN62zv0THHL0zE6w'
          public: false
          authorization_policy: 'admins'
          consent_mode: 'implicit'
          redirect_uris:
            - 'https://radarr.${DOMAIN_1}/signin-oidc'
          scopes:
            - 'openid'
            - 'profile'
            - 'email'
          grant_types:
            - 'authorization_code'
          response_types:
            - 'code'
          token_endpoint_auth_method: 'client_secret_post'
        # https://www.authelia.com/integration/openid-connect/clients/nextcloud/ (user_oidc app)
        # Configured in Nextcloud via occ user_oidc:provider (stored in the Nextcloud DB)
        - client_id: 'nextcloud'
          client_name: 'Nextcloud'
          # PBKDF2 hash; plaintext lives in general/nextcloud/app/oidc.secret.yaml
          client_secret: '$pbkdf2-sha512$310000$/6ywusf7OjfurAQdMYtWAQ$9mI99N2vF0un4Fo2cvhB6FDlsOVOlkv0FE3OP5n0HU1QRvN5zxNQzteySabNe0ddy9YJoIvqgWGSLkXUiHCNuw'
          public: false
          authorization_policy: 'members'
          consent_mode: 'implicit'
          claims_policy: 'id_token_profile'
          redirect_uris:
            - 'https://nextcloud.${DOMAIN_1}/apps/user_oidc/code'
          # user_oidc always requests the 'groups' claim (Authelia rejects the login without
          # this scope), even with group provisioning off
          scopes:
            - 'openid'
            - 'profile'
            - 'email'
            - 'groups'
          grant_types:
            - 'authorization_code'
          response_types:
            - 'code'
          token_endpoint_auth_method: 'client_secret_post'
