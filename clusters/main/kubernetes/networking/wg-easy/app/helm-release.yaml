---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wg-easy
  namespace: wg-easy
spec:
  interval: 15m
  chart:
    spec:
      chart: wg-easy
      version: 20.0.3
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 5m
  maxHistory: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    credentials:
      minio:
          type: s3
          url: "http://${S3_URL}"
          bucket: "${S3_BUCKET}-wg-easy"
          accessKey: "${S3_ACCESS_KEY}"
          secretKey: "${S3_SECRET_KEY}"
          encrKey: "${S3_ENCRYPTION_KEY}"
    service:
      vpn:
        loadBalancerIP: ${WG_EASY_IP}
        type: LoadBalancer
        externalTrafficPolicy: Local
        integrations:
          metallb:
            enabled: true
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        # Login via Authelia OIDC (see env below), no forward-auth
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-1-le-prod
        hosts:
          - host: vpn.${DOMAIN_1}
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                # https://wg-easy.github.io/wg-easy/latest/advanced/config/external-authentication/
                OAUTH_PROVIDERS: oidc
                OAUTH_OIDC_SERVER: https://auth.${DOMAIN_1}
                OAUTH_OIDC_CLIENT_ID: wg-easy
                OAUTH_OIDC_NAME: Authelia
                OAUTH_OIDC_CLIENT_SECRET:
                  secretKeyRef:
                    expandObjectName: false
                    name: wg-easy-oidc
                    key: OAUTH_OIDC_CLIENT_SECRET
                # Every OAuth user would become admin (no roles yet): link accounts manually instead
                OAUTH_AUTO_REGISTER: "false"
                # Straight to Authelia; fallback: /login?auto_launch=false
                OAUTH_AUTO_LAUNCH: oidc
    persistence:
      config:
        volsync:
        - name: config
          type: restic
          credentials: minio
          dest:
            enabled: true
          src:
            enabled: true
            trigger:
              schedule: 40 1 * * *
    metrics:
      main:
        enabled: true
        endpoints:
          - port: main
            path: /metrics/prometheus
