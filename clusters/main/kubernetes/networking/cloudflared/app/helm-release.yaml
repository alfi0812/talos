apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  interval: 5m
  chart:
    spec:
      chart: cloudflared
      version: 17.0.10
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 5m
  values:
    portal:
      open:
        enabled: false
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                TUNNEL_TOKEN: "${TUNNEL_TOKEN}"
    service:
      main:
        enabled: true
        ports:
          main:
            enabled: true
            port: 20241
    metrics:
      main:
        enabled: true
        endpoints:
          - port: main
            path: /metrics
