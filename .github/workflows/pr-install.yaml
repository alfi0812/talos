name: "Pull Request: Install"

on:
  workflow_dispatch:
  pull_request:
#    paths:
#      - "**/helm-release.yaml"

jobs:
  detect:
    name: Detect changed HelmReleases
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      tested: ${{ steps.set.outputs.tested }}
      skipped: ${{ steps.set.outputs.skipped }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect changed HelmReleases
        id: set
        run: |
          files=$(git diff \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.sha }}" \
            --name-only | grep 'helm-release.yaml$' || true)
          
          if [ -z "$files" ]; then
            echo "🔍 No HelmReleases changed"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          echo "🔍 Detected HelmReleases:"
          printf '%s\n' "$files"
          
          # --------------------------------------------------
          # Filter releases using YAML skip list
          # --------------------------------------------------

          mapfile -t files_array <<< "$files"

          filtered=()
          skipped=()

          SKIP_FILE="ci/.config.yaml"

          if [ -f "$SKIP_FILE" ]; then
            mapfile -t skip_list < <(yq -r '.skipList[]' "$SKIP_FILE")
          else
            skip_list=()
          fi

          for file in "${files_array[@]}"; do
            dir=$(dirname "$file")
            skip=false

            for skip_entry in "${skip_list[@]}"; do
              if [ "$dir" = "$skip_entry" ]; then
                skip=true
                break
              fi
            done

            if [ "$skip" = true ]; then
              skipped+=("$file")
            else
              filtered+=("$file")
            fi
          done


          echo ""
          echo "===== HelmRelease CI scan result ====="

          if [ ${#skipped[@]} -gt 0 ]; then
            echo "⏭️ Skipped:"
            printf '  - %s\n' "${skipped[@]}"
          else
            echo "⏭️ Skipped: none"
          fi

          if [ ${#filtered[@]} -gt 0 ]; then
            echo "🧪 To test:"
            printf '  - %s\n' "${filtered[@]}"
          else
            echo "🧪 To test: none"
          fi
          echo "======================================"
          echo ""

          # ---------- GitHub job summary ----------
          {
            echo "## HelmRelease CI result"
            echo ""
            echo "### ⏭️ Skipped"
            if [ ${#skipped[@]} -gt 0 ]; then
              printf -- "- %s\n" "${skipped[@]}"
            else
              echo "_none_"
            fi
            echo ""
            echo "### 🧪 To test"
            if [ ${#filtered[@]} -gt 0 ]; then
              printf -- "- %s\n" "${filtered[@]}"
            else
              echo "_none_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # ---------- Prepare Outputs ----------

          tested_list="_none_"
          skipped_list="_none_"

          if [ ${#filtered[@]} -gt 0 ]; then
            tested_list=$(printf '%s\n' "${filtered[@]}")
          fi

          if [ ${#skipped[@]} -gt 0 ]; then
            skipped_list=$(printf '%s\n' "${skipped[@]}")
          fi

          {
            echo "tested<<EOF"
            echo "$tested_list"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "skipped<<EOF"
            echo "$skipped_list"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # ---------- Matrix handling ----------

          if [ ${#filtered[@]} -eq 0 ]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          json=$(printf '%s\n' "${filtered[@]}" | jq -R . | jq -s .)

          {
            echo "matrix<<EOF"
            echo "$json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  test:
    needs: detect
    name: Test HelmReleases
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        helmrelease: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      # --------------------------------------------------
      # Checkout repo
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # --------------------------------------------------
      # Install required CLI tools
      # --------------------------------------------------
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq gettext
          sudo curl -sSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      # --------------------------------------------------
      # Dummy env vars for Helm interpolation
      # --------------------------------------------------
      - name: Load dummy env vars from config
        run: |
          yq e '.dummyEnv | to_entries | .[] | "\(.key)=\(.value)"' ci/.config.yaml >> $GITHUB_ENV

          
          
      # --------------------------------------------------
      # Create ephemeral k3d cluster
      # --------------------------------------------------
      - name: Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5

      - name: Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      # Ubuntu 26.04 ships a path-attached AppArmor profile for wg-quick
      # (/etc/apparmor.d/wg-quick). It also attaches to /usr/bin/wg-quick inside
      # privileged (unconfined) containers and denies exec of busybox applets,
      # breaking wg-easy ("/usr/bin/readlink: Permission denied").
      - name: Unload host wg-quick AppArmor profile
        run: |
          if [ -f /etc/apparmor.d/wg-quick ]; then
            sudo apparmor_parser -R /etc/apparmor.d/wg-quick || true
          fi

      # wg-easy's default PostUp hooks use legacy iptables (nat/filter tables);
      # the ubuntu-26.04 kernel does not autoload those modules.
      - name: Load legacy iptables kernel modules
        run: |
          for m in ip_tables iptable_nat iptable_filter; do
            sudo modprobe "$m" || echo "::warning::module $m not available"
          done
          lsmod | grep -E '^(ip_tables|iptable_)' || true

      - name: Create k3d cluster
        uses: nolar/setup-k3d-k3s@v1
        with:
          version: latest
          k3d-args: --k3s-arg --disable=metrics-server@server:*
          # github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove node taints
        run: |
          kubectl taint --all=true nodes node.cloudprovider.kubernetes.io/uninitialized- || true

      # --------------------------------------------------
      # Deploy & test HelmRelease
      # --------------------------------------------------
      - name: Test HelmRelease
        run: |
          chmod +x .github/scripts/deploy_helmrelease.sh
          bash .github/scripts/deploy_helmrelease.sh "${{ matrix.helmrelease }}"
