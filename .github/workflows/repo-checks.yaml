---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Repo Checks

# Checks for the repo tooling, each only when its files change:
#   - actionlint: GitHub workflow files
#   - Renovate config: validated with the Renovate version the cluster runs
#   - Talos / Kubernetes: the Kubernetes version tuppr upgrades to is supported by the Talos version
#   - pre-commit: the hooks of .pre-commit-config.yaml on all files (every PR)

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Repo Checks - Filter
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.workflows.outputs.changed_files }}
      renovate: ${{ steps.renovate.outputs.changed_files }}
      upgrades: ${{ steps.upgrades.outputs.changed_files }}
    steps:
      - name: Workflow files
        id: workflows
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |
            .github/workflows/**/*
            .github/actionlint.yaml
            .github/scripts/**/*
      - name: Renovate config
        id: renovate
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |
            .github/renovate.json5
            .github/renovate/**/*
            clusters/main/kubernetes/apps/renovate/app/helm-release.yaml
      - name: Talos and Kubernetes versions
        id: upgrades
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |
            clusters/main/kubernetes/flux-system/flux/upgradesettings.yaml
            .github/scripts/talos_k8s_compat.sh

  actionlint:
    if: ${{ needs.filter.outputs.workflows != '[]' }}
    needs: filter
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup actionlint
        env:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          ACTIONLINT_VERSION: v1.7.12
        run: |
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz" \
            | tar xz -C "$bin" actionlint
          echo "$bin" >> "$GITHUB_PATH"
      # Also runs shellcheck (preinstalled on the runner) on the run: scripts.
      # Config (self-hosted runner labels): .github/actionlint.yaml
      - name: Run actionlint
        run: actionlint -color -shellcheck="$(command -v shellcheck)"

  renovate:
    if: ${{ needs.filter.outputs.renovate != '[]' }}
    needs: filter
    name: Renovate config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup yq
        env:
          # renovate: datasource=github-releases depName=mikefarah/yq
          YQ_VERSION: v4.54.3
        run: |
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o "$bin/yq"
          chmod +x "$bin/yq"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Install helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2
      - name: Renovate version of the cluster
        id: version
        run: echo "renovate=$(bash ./.github/scripts/renovate_version.sh)" >> "$GITHUB_OUTPUT"
      # --strict also fails on options that need a migration
      - name: Validate Renovate config
        env:
          RENOVATE_VERSION: ${{ steps.version.outputs.renovate }}
        run: |
          docker run --rm -v "$PWD/.github:/cfg:ro" -w /cfg "ghcr.io/renovatebot/renovate:${RENOVATE_VERSION}" \
            renovate-config-validator --strict --no-global renovate.json5 renovate/*.json5

  talos-kubernetes:
    if: ${{ needs.filter.outputs.upgrades != '[]' }}
    needs: filter
    name: Talos / Kubernetes compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup yq
        env:
          # renovate: datasource=github-releases depName=mikefarah/yq
          YQ_VERSION: v4.54.3
        run: |
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o "$bin/yq"
          chmod +x "$bin/yq"
          echo "$bin" >> "$GITHUB_PATH"
      # upgradesettings.yaml of the base branch, to show "old → new" in the comment
      - name: Base versions
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          git show "FETCH_HEAD:clusters/main/kubernetes/flux-system/flux/upgradesettings.yaml" \
            > "$RUNNER_TEMP/base-upgradesettings.yaml" || true
      - name: Check compatibility
        id: compat
        env:
          BASE_SETTINGS: ${{ runner.temp }}/base-upgradesettings.yaml
          TALOS_K8S_REPORT: ${{ runner.temp }}/talos-k8s-report.md
        run: bash ./.github/scripts/talos_k8s_compat.sh

      # PR comment as the bot: compatible or not, with the versions. One comment, updated on each run.
      - name: Generate Token
        if: ${{ !cancelled() && (steps.compat.outcome == 'success' || steps.compat.outcome == 'failure') }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - name: Comment compatibility report
        if: ${{ !cancelled() && steps.app-token.outcome == 'success' }}
        continue-on-error: true
        uses: mshick/add-pr-comment@9302b90c1c7d26c4aebe20b7846b4a8a434bee94
        with:
          repo-token: ${{ steps.app-token.outputs.token }}
          message-id: talos-kubernetes-compatibility
          message-path: ${{ runner.temp }}/talos-k8s-report.md

  # The same hooks as the local git hook (whitespace, final newline, YAML syntax, merge
  # conflict markers). Fixes are not pushed: run `pre-commit run --all-files` and commit.
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pre-commit
        env:
          # renovate: datasource=pypi depName=pre-commit
          PRE_COMMIT_VERSION: 4.7.0
        run: pipx install "pre-commit==${PRE_COMMIT_VERSION}"
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color always

  success:
    if: ${{ !cancelled() }}
    needs:
      - actionlint
      - renovate
      - talos-kubernetes
      - pre-commit
    name: Repo Checks - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
