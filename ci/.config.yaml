# Path of helm-release file to skip during CI testing
skipList:
  - clusters/main/kubernetes/kube-system/cilium/app
  - clusters/main/kubernetes/system/longhorn/app
  - clusters/main/kubernetes/apps/renovate/app
  - clusters/main/kubernetes/auth/authelia/app
  - clusters/main/kubernetes/system/system-upgrade/tuppr/app
# HelmReleases the install test runs when the test itself changes
# (deploy/template scripts, pr-install.yaml, this file) and on a manual run
# without input. Together they cover each code path of deploy_helmrelease.sh.
installSamples:
  # Ingress, Prometheus CRDs, cert-manager annotations
  - clusters/main/kubernetes/apps/konflate/app/helm-release.yaml
  # Extra manifests in the app folder (PrometheusRule, ScrapeConfig, AlertmanagerConfig)
  - clusters/main/kubernetes/observability/kube-prometheus-stack/app/helm-release.yaml
  # postRenderers, CRDs shipped as templates
  - clusters/main/kubernetes/system/metallb/app/helm-release.yaml
  # CNPG operator and Cluster, dummy external secrets
  - clusters/main/kubernetes/general/vaultwarden/app/helm-release.yaml
dummyEnv:
  DOMAIN_0: base.dummy0.local
  DOMAIN_1: base.dummy1.local
  DOMAIN: dummy.local
  PODNET: 10.42.0.0/16
  SVCNET: 10.43.0.0/16
  METALLB_RANGE: 192.168.20.211-192.168.20.219
  GATUS_BUDDY_HEARTBEAT_TOKEN: abc123def
  NGINX_EXTERNAL_IP: 192.168.20.215
  NGINX_INTERNAL_IP: 192.168.20.214
  API_TDARR: tapi_ci_dummy_key_0123456789
  DOMAIN_0_EMAIL: ci@dummy0.local
  DOMAIN_1_EMAIL: ci@dummy1.local
  DOMAIN_0_CLOUDFLARE_TOKEN: ci_dummy_cloudflare_token_0
  DOMAIN_1_CLOUDFLARE_TOKEN: ci_dummy_cloudflare_token_1
